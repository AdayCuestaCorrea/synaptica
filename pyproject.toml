[project]
name = "synaptica"
version = "0.1.0"
description = "SYNAPTICA, your Neuroscience hub: a bilingual (ES/EN) neuroscience website that updates itself every day from open sources."
license = "AGPL-3.0-only"
authors = [{ name = "Aday Cuesta Correa" }]
requires-python = ">=3.14,<3.15"
dependencies = [
    # CLI framework for the `syn` commands (same as Paleo Atlas).
    "typer>=0.27.3",
]

[project.scripts]
syn = "synaptica.cli:app"

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff",
    "pytest",
]

[tool.uv]
# CachyOS is a rolling distro: use a uv-managed interpreter so a system
# Python upgrade never breaks the virtualenv.
python-preference = "only-managed"

[tool.uv.build-backend]
module-name = "synaptica"

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[project]
name = "synaptica"
version = "0.1.0"
description = "SYNAPTICA, your Neuroscience hub: a bilingual (ES/EN) neuroscience website that updates itself every day from open sources."
license = "AGPL-3.0-only"
license-files = ["LICENSE", "LICENSE-CONTENT.md"]
authors = [{ name = "Aday Cuesta Correa" }]
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    # HTTP client for the sources (spike S1, ingestion from Phase 1).
    "httpx>=0.28.1",
    # CLI framework for the `syn` commands (same as Paleo Atlas).
    "typer>=0.27.3",
]

[project.scripts]
syn = "synaptica.cli:app"

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff",
    "pytest",
]
# Spike S2 (decision D1): the same dbt project on BigQuery sandbox and on DuckDB.
# Only `uv sync --group spike-s2`; the regular CI does not install it.
spike-s2 = [
    "dbt-bigquery>=1.12.2",
    "dbt-duckdb>=1.11.1",
]

[tool.uv]
# CachyOS is a rolling distro: use a uv-managed interpreter so a system
# Python upgrade never breaks the virtualenv.
python-preference = "only-managed"

[tool.uv.build-backend]
module-name = "synaptica"

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

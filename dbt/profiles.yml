# Paths come from the environment so local runs and CI share one profile.
# SYN_DATA_DIR defaults to ../data (the repository's data/ folder, a worktree of `data`).
synaptica:
  target: local
  outputs:
    local:
      type: duckdb
      path: "{{ env_var('SYN_DATA_DIR', '../data') }}/warehouse.duckdb"
      threads: 4

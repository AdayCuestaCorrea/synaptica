version: 2

models:
  - name: dim_study
    description: >
      One row per study, merged by DOI from PubMed, bioRxiv/medRxiv, Europe PMC and the
      research items of the journal feeds, with its three signals (review status,
      species, integrity) and the preprint ↔ journal-version links.
    columns:
      - name: study_id
        data_tests: [unique, not_null]
      - name: pmid
        data_tests: [unique]
      - name: entered_on
        data_tests: [not_null]
      - name: review_status
        data_tests:
          - not_null
          - accepted_values:
              arguments: {values: [preprint, journal, unknown]}
      - name: species
        data_tests:
          - not_null
          - accepted_values:
              arguments: {values: [humans, animals, both, unknown]}
      - name: integrity
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [retracted, partially_retracted, withdrawn, concern, corrected, none]
      - name: neuro_basis
        description: Why it counts as neuroscience; null when it does not (or not yet).
        data_tests:
          - accepted_values:
              arguments: {values: [source_query, journal_scope, openalex, llm]}
      - name: news_type
        description: Type from `syn news classify` (step 14a); null if not classified.
        data_tests:
          - accepted_values:
              arguments: {values: [healthy_brain, disease, clinical_trial, technique, noise]}
      - name: published_doi
        description: On a preprint, the DOI of its journal version (another study).
      - name: preprint_doi
        description: On a journal version, the DOI of its preprint (another study).

  - name: fct_news_item
    description: >
      One row per news item: popular-science articles and the news, commentary and
      perspectives of the journal feeds.
    columns:
      - name: story_id
        description: Same-story group (step 15); the item itself when never grouped.
        data_tests:
          - not_null
          - relationships:
              arguments: {to: ref('fct_news_item'), field: news_item_id}
      - name: news_item_id
        data_tests: [unique, not_null]
      - name: origin
        data_tests:
          - accepted_values:
              arguments: {values: [outlet, journal]}
      - name: lang
        data_tests:
          - not_null
          - accepted_values:
              arguments: {values: [es, en]}
      - name: url
        data_tests: [not_null]
      - name: neuro_basis
        data_tests:
          - accepted_values:
              arguments: {values: [feed_scope, journal_scope, openalex, llm]}
      - name: news_type
        data_tests:
          - accepted_values:
              arguments: {values: [healthy_brain, disease, clinical_trial, technique, noise]}

unit_tests:
  - name: pubmed_candidate_signals
    description: Each signal from PubMed, and notices left out of the studies.
    model: int_study__candidates
    given:
      - input: ref('int_pubmed__records')
        rows:
          - {pmid: "1", doi: "10.1/a", journal: "J", publication_types: ['Journal Article'],
             mesh_uis: ['D006801'], entered_on: 2026-11-09}
          - {pmid: "2", doi: "10.1/b", journal: "J", publication_types: ['Preprint'],
             mesh_uis: ['D006801', 'D000818'], entered_on: 2026-11-09}
          - {pmid: "3", doi: null, journal: "J", publication_types: ['Journal Article'],
             mesh_uis: [], entered_on: 2026-11-09}
          - {pmid: "4", doi: "10.1/d", journal: "J",
             publication_types: ['Journal Article', 'Retracted Publication'],
             mesh_uis: ['D000818'], entered_on: 2026-11-09}
          - {pmid: "5", doi: "10.1/e", journal: "J", publication_types: ['Published Erratum'],
             mesh_uis: [], entered_on: 2026-11-09}
      - input: ref('int_preprints__latest')
        rows: []
      - input: ref('int_europepmc__records')
        rows: []
      - input: ref('int_journals__items')
        rows: []
      - input: ref('stg_derived__neuro')
        rows: []
    expect:
      rows:
        - {study_id: "10.1/a", review_status: journal, species: humans, flagged_retracted: false}
        - {study_id: "10.1/b", review_status: preprint, species: both, flagged_retracted: false}
        - {study_id: "pmid:3", review_status: journal, species: unknown, flagged_retracted: false}
        - {study_id: "10.1/d", review_status: journal, species: animals, flagged_retracted: true}

  - name: dim_study_merges_sources_and_links_preprints
    description: >
      PubMed wins the metadata, Europe PMC fills species when PubMed has no MeSH yet and
      adds the licence; a preprint and its journal version stay two studies, linked.
    model: dim_study
    given:
      - input: ref('int_study__candidates')
        rows:
          - {study_id: "10.1/a", source: pubmed, priority: 1, doi: "10.1/a", pmid: "1",
             title: "From PubMed", entered_on: 2026-11-09, review_status: journal,
             species: unknown, flagged_retracted: false}
          - {study_id: "10.1/a", source: europepmc, priority: 3, doi: "10.1/a", pmid: "1",
             pmcid: "PMC1", title: "From EPMC", entered_on: 2026-11-08,
             review_status: journal, species: humans, flagged_retracted: false,
             is_open_access: true, license: "cc by"}
          - {study_id: "10.1101/p", source: biorxiv, priority: 2, doi: "10.1101/p",
             title: "Preprint", entered_on: 2026-11-01, review_status: preprint,
             species: unknown, flagged_retracted: false}
          - {study_id: "10.1/j", source: journals, priority: 4, doi: "10.1/j",
             title: "Journal version", entered_on: 2026-11-09, review_status: journal,
             species: unknown, flagged_retracted: false}
      - input: ref('int_preprints__latest')
        rows:
          - {doi: "10.1101/p", published_doi: "10.1/j"}
      - input: ref('int_study__integrity')
        rows:
          - {study_id: "10.1/j", integrity: corrected, notice_dois: ['10.9/n']}
      - input: ref('stg_openalex__works')
        rows: []
      - input: ref('stg_preprints__published')
        rows: []
      - input: ref('stg_derived__news_types')
        rows: []
    expect:
      rows:
        - {study_id: "10.1/a", title: "From PubMed", pmcid: "PMC1", entered_on: 2026-11-08,
           review_status: journal, species: humans, is_open_access: true, license: "cc by",
           integrity: none, published_doi: null, preprint_doi: null}
        - {study_id: "10.1101/p", title: "Preprint", pmcid: null, entered_on: 2026-11-01,
           review_status: preprint, species: unknown, is_open_access: false, license: null,
           integrity: none, published_doi: "10.1/j", preprint_doi: null}
        - {study_id: "10.1/j", title: "Journal version", pmcid: null, entered_on: 2026-11-09,
           review_status: journal, species: unknown, is_open_access: false, license: null,
           integrity: corrected, published_doi: null, preprint_doi: "10.1101/p"}

  - name: dim_study_withdrawn_preprints
    description: >
      A preprint whose latest version is "withdrawn" shows as withdrawn and leaves Latest;
      a Crossref retraction outranks it, and it outranks a correction.
    model: dim_study
    given:
      - input: ref('int_study__candidates')
        rows:
          - {study_id: "10.1101/w", source: biorxiv, priority: 2, doi: "10.1101/w",
             title: "WITHDRAWN: A", entered_on: 2026-11-09, published_on: 2026-11-09,
             review_status: preprint, species: unknown, flagged_retracted: false,
             neuro_basis: source_query, is_english: true, has_abstract: true}
          - {study_id: "10.1101/r", source: biorxiv, priority: 2, doi: "10.1101/r",
             title: "WITHDRAWN: B", entered_on: 2026-11-09, published_on: 2026-11-09,
             review_status: preprint, species: unknown, flagged_retracted: false,
             neuro_basis: source_query, is_english: true, has_abstract: true}
          - {study_id: "10.1101/c", source: biorxiv, priority: 2, doi: "10.1101/c",
             title: "WITHDRAWN: C", entered_on: 2026-11-09, published_on: 2026-11-09,
             review_status: preprint, species: unknown, flagged_retracted: false,
             neuro_basis: source_query, is_english: true, has_abstract: true}
          - {study_id: "10.1101/n", source: biorxiv, priority: 2, doi: "10.1101/n",
             title: "Still up", entered_on: 2026-11-09, published_on: 2026-11-09,
             review_status: preprint, species: unknown, flagged_retracted: false,
             neuro_basis: source_query, is_english: true, has_abstract: true}
      - input: ref('int_preprints__latest')
        rows:
          - {doi: "10.1101/w", preprint_type: withdrawn}
          - {doi: "10.1101/r", preprint_type: withdrawn}
          - {doi: "10.1101/c", preprint_type: withdrawn}
          - {doi: "10.1101/n", preprint_type: "new results"}
      - input: ref('int_study__integrity')
        rows:
          - {study_id: "10.1101/r", integrity: retracted, notice_dois: ['10.9/r']}
          - {study_id: "10.1101/c", integrity: corrected, notice_dois: ['10.9/c']}
      - input: ref('stg_openalex__works')
        rows: []
      - input: ref('stg_preprints__published')
        rows: []
      - input: ref('stg_derived__news_types')
        rows: []
    expect:
      rows:
        - {study_id: "10.1101/w", integrity: withdrawn, news_candidate: false}
        - {study_id: "10.1101/r", integrity: retracted, news_candidate: false}
        - {study_id: "10.1101/c", integrity: withdrawn, news_candidate: false}
        - {study_id: "10.1101/n", integrity: none, news_candidate: true}

  - name: int_study__integrity_most_serious_wins
    model: int_study__integrity
    given:
      - input: ref('stg_crossref__notices')
        rows:
          - {notice_doi: "10.9/n1", updated_doi: "10.1/a", update_type: correction}
          - {notice_doi: "10.9/n2", updated_doi: "10.1/a", update_type: retraction}
          - {notice_doi: "10.9/n3", updated_doi: "10.1/b", update_type: erratum}
          - {notice_doi: "10.9/n4", updated_doi: "10.1/c", update_type: new_version}
      - input: ref('int_retractionwatch__notices')
        rows: []
      - input: ref('int_study__candidates')
        rows: []
    expect:
      rows:
        - {study_id: "10.1/a", integrity: retracted, notice_dois: ['10.9/n1', '10.9/n2'],
           sources: [crossref]}
        - {study_id: "10.1/b", integrity: corrected, notice_dois: ['10.9/n3'],
           sources: [crossref]}

  - name: int_study__integrity_retraction_watch
    description: >
      Retraction Watch adds the retractions Crossref has no notice for, shares notices
      with Crossref without repeating them, finds a study by PubMed ID when it has no DOI,
      and a reinstatement shows as corrected and cancels its earlier retraction (v140).
    model: int_study__integrity
    given:
      - input: ref('stg_crossref__notices')
        rows:
          - {notice_doi: "10.9/x", updated_doi: "10.1/x", update_type: retraction}
          - {notice_doi: "10.9/k", updated_doi: "10.1/k", update_type: retraction}
      - input: ref('int_retractionwatch__notices')
        rows:
          - {record_id: "1", original_doi: "10.1/only-rw", nature: retraction,
             notice_doi: null, noticed_on: 2026-10-01}
          - {record_id: "2", original_doi: "10.1/x", nature: retraction,
             notice_doi: "10.9/x", noticed_on: 2026-10-01}
          - {record_id: "3", original_doi: null, original_pmid: "111",
             nature: expression_of_concern, notice_doi: "10.9/p", noticed_on: 2026-10-01}
          - {record_id: "4", original_doi: null, original_pmid: "222", nature: correction,
             notice_doi: null, noticed_on: 2026-10-01}
          - {record_id: "5", original_doi: "10.1/r", nature: retraction,
             notice_doi: "10.9/r1", noticed_on: 2025-01-01}
          - {record_id: "6", original_doi: "10.1/r", nature: reinstatement,
             notice_doi: "10.9/r2", noticed_on: 2025-06-01}
          - {record_id: "7", original_doi: "10.1/k", nature: reinstatement,
             notice_doi: "10.9/k2", noticed_on: 2025-06-01}
          - {record_id: "8", original_doi: "10.1/later", nature: reinstatement,
             notice_doi: null, noticed_on: 2025-06-01}
          - {record_id: "9", original_doi: "10.1/later", nature: retraction,
             notice_doi: null, noticed_on: 2026-01-01}
      - input: ref('int_study__candidates')
        rows:
          - {study_id: "10.1/p", doi: "10.1/p", pmid: "111"}
    expect:
      rows:
        - {study_id: "10.1/only-rw", integrity: retracted, notice_dois: null,
           sources: [retraction_watch]}
        - {study_id: "10.1/x", integrity: retracted, notice_dois: ['10.9/x'],
           sources: [crossref, retraction_watch]}
        - {study_id: "10.1/p", integrity: concern, notice_dois: ['10.9/p'],
           sources: [retraction_watch]}
        - {study_id: "pmid:222", integrity: corrected, notice_dois: null,
           sources: [retraction_watch]}
        - {study_id: "10.1/r", integrity: corrected, notice_dois: ['10.9/r2'],
           sources: [retraction_watch]}
        - {study_id: "10.1/k", integrity: retracted, notice_dois: ['10.9/k', '10.9/k2'],
           sources: [crossref, retraction_watch]}
        - {study_id: "10.1/later", integrity: retracted, notice_dois: null,
           sources: [retraction_watch]}

  - name: journal_item_kinds
    description: Sections map to kinds; Nature's DOIs decide when there is no section.
    model: int_journals__items
    given:
      - input: ref('stg_journals__items')
        rows:
          - {item_key: "10.1016/c1", journal: cell, section: Article, title: "A",
             version_date: 2026-11-09}
          - {item_key: "10.1016/c2", journal: cell, section: Preview, title: "B",
             version_date: 2026-11-09}
          - {item_key: "10.1038/s41586-1", journal: nature, doi: "10.1038/s41586-1",
             title: "Paper", version_date: 2026-11-09}
          - {item_key: "10.1038/s41593-2", journal: nature_neuroscience,
             doi: "10.1038/s41593-2", title: "Author Correction: X", version_date: 2026-11-09}
          - {item_key: "10.1038/d41586-3", journal: nature, doi: "10.1038/d41586-3",
             title: "News", version_date: 2026-11-09}
          - {item_key: "10.1126/s4", journal: science, section: "Something new", title: "C",
             version_date: 2026-11-09}
      - input: ref('journal_sections')
        rows:
          - {section: Article, kind: research}
          - {section: Preview, kind: news}
      - input: ref('journals')
        rows:
          - {journal: cell, name: Cell, scope: general}
          - {journal: nature, name: Nature, scope: general}
          - {journal: nature_neuroscience, name: Nature Neuroscience, scope: neuro}
          - {journal: science, name: Science, scope: general}
    expect:
      rows:
        - {item_key: "10.1016/c1", kind: research}
        - {item_key: "10.1016/c2", kind: news}
        - {item_key: "10.1038/s41586-1", kind: research}
        - {item_key: "10.1038/s41593-2", kind: correction}
        - {item_key: "10.1038/d41586-3", kind: news}
        - {item_key: "10.1126/s4", kind: news}

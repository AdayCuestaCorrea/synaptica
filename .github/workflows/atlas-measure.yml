name: Neuro Atlas measure (temporary)

# A2.2 (Aday's option a, SCOPE v193): measure the Neuro Atlas abstract rule (two mentions)
# with the real abstracts, which live only in the Actions cache of the daily pipeline.
# Only on a push to fase-2, so main and pipeline.yml stay untouched while the Phase 1 clock
# runs; a branch may restore the caches of the default branch (read only: nothing is saved).
# No LLM, no source is asked: the warehouse is rebuilt from the data branch, as in the
# pipeline. The repository is public, so its log is too: `syn atlas measure` prints counts
# and PMIDs only, never a word of an abstract. To be deleted once the rule is decided.

on:
  push:
    branches: [fase-2]

concurrency:
  group: atlas-measure
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SYN_DATA_DIR: ${{ github.workspace }}/data
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Check out the data branch
        uses: actions/checkout@v7.0.1
        with:
          ref: data
          path: data

      - name: Restore the private cache (read only)
        uses: actions/cache/restore@v6.1.0
        with:
          path: data/cache
          key: synaptica-cache-none
          restore-keys: synaptica-cache-

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Install
        run: uv sync --locked

      - name: dbt build
        # A failed dbt test (freshness, say) still leaves the warehouse to measure.
        continue-on-error: true
        run: uv run syn build

      - name: Measure the abstract rule
        run: uv run syn atlas measure | tee -a "$GITHUB_STEP_SUMMARY"

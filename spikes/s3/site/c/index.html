<title>SYNAPTICA · S3 · C (Niivue)</title>
<link rel="stylesheet" href="../common/common.css">
<style>
/* Step 7.3: one row per axis, slider and typed millimetres. C only. */
.planes { display: grid; gap: 4px; padding: 6px 12px; border-top: 1px solid var(--line); }
.planes[hidden] { display: none; }
.planes label { display: grid; grid-template-columns: 9em 1fr 5.5em 2em; gap: 8px; align-items: center; }
.planes input[type="range"] { width: 100%; }
.planes input[type="number"] { width: 100%; font: inherit; font-variant-numeric: tabular-nums; text-align: right; }
@media (max-width: 799px) { .planes label { grid-template-columns: 7em 1fr 5em 2em; } }
/* Step 7.4: name next to the clicked point, and the short name as a glossary hook. C only. */
.stage .tag {
  position: absolute; transform: translate(10px, -50%); pointer-events: none; white-space: nowrap;
  padding: 3px 8px; border-radius: 6px; font-size: 0.85rem; line-height: 1.3;
  background: var(--bg, #fff); color: var(--fg, #111); border: 1px solid var(--line);
  box-shadow: 0 1px 4px rgb(0 0 0 / 0.25);
}
.stage .tag[hidden] { display: none; }
.stage .tag.left { transform: translate(calc(-100% - 10px), -50%); }
.panel abbr { text-decoration: underline dotted; cursor: help; }
.panel .small { font-size: 0.8rem; }
/* Improvement M1: one search box per viewer, results over the canvas. C only. */
.search { position: relative; padding: 6px 12px 0; }
.search input { width: 100%; font: inherit; padding: 4px 8px; box-sizing: border-box; }
.search ul {
  position: absolute; z-index: 5; left: 12px; right: 12px; margin: 2px 0 0; padding: 4px 0; list-style: none;
  background: var(--bg, #fff); color: var(--fg, #111); border: 1px solid var(--line); border-radius: 6px;
  box-shadow: 0 2px 8px rgb(0 0 0 / 0.3); max-height: 16em; overflow-y: auto;
}
.search ul[hidden] { display: none; }
.search li { padding: 4px 10px; cursor: pointer; font-size: 0.9rem; }
.search li[aria-selected="true"], .search li:hover { background: color-mix(in srgb, var(--accent) 25%, transparent); }
.search li.empty { color: var(--muted); cursor: default; }
/* Step 7.6: the mode selector, one group of buttons. C only. */
.modes { display: inline-flex; gap: 0; }
.modes[hidden] { display: none; }
.modes button { border-radius: 0; }
.modes button:first-child { border-radius: 6px 0 0 6px; }
.modes button:last-child { border-radius: 0 6px 6px 0; }
/* Step 7.5: millimetre ticks over the coronal slice, and what the millimetres are. C only. */
.stage canvas.axes { position: absolute; inset: 0; pointer-events: none; }
.planes .frame { margin: 4px 0 0; font-size: 0.8rem; opacity: 0.85; }
</style>
<script src="../vendor/niivue-0.69.0/niivue.umd.js"></script>
<script type="module" src="c.js"></script>
</head>

<main>

      <button id="modeColor" data-mode="color" aria-pressed="true" data-t="modeColor"></button>

      <button id="modeStain" data-mode="stain" aria-pressed="false" data-t="modeStain"></button>
    </span>

      <div class="panel"></div>
      <div class="licence"></div>
      <div class="licence-layers"></div>
      <div class="licence licence-extra" hidden></div>
    </section>
  </div>
</main>
<footer>
  <p><span data-t="libsC"></span> <a href="../vendor/niivue-0.69.0/SOURCE.md" data-t="licences"></a>.</p>

# Rat ↔ human pairs of Neuro Atlas: which Waxholm region goes with which human regions.
#
# These are the 12 test pairs of spike S3 (Phase 0), proposals only: none has a grade yet. The
# grade (clear, partial or disputed) and the short note are Sofía's (SCOPE §7, «Rata ↔ humano»);
# her table replaces this seed. Only IDs and names: no geometry of either atlas, so the pairs are
# SYNAPTICA's own data and never a derived work of the two atlases (CLAUDE.md, "Licencias").
#
# waxholm: Waxholm/BrainGlobe id. atlas: the human layer (julich, cerebra, cit168, icbm_wm).
# human: region names exactly as in that layer's labels.json.

[[pair]]
kind = "surface"
waxholm = 408  # M1
atlas = "julich"
human = ["Area 4a (PreCG)", "Area 4p (PreCG)"]

[[pair]]
kind = "internal"
waxholm = 1021  # HF
atlas = "julich"
human = [
    "CA1 (Hippocampus)",
    "CA2 (Hippocampus)",
    "CA3 (Hippocampus)",
    "DG (Hippocampus)",
    "Subc (Hippocampus, Subicular complex)",
]

